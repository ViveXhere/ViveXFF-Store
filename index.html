<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ViveX Store</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:25px 15px;
}

.container{
    width:100%;
    max-width:420px;
    margin:auto;
}

.brand{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    margin-bottom:25px;
}

.product{
    background:#1c1c1c;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.4);
}

.product img{
    width:100%;
    max-width:280px;
    height:280px;
    object-fit:contain;
    border-radius:15px;
}

.product h2{
    margin:18px 0 8px;
    font-size:25px;
}

.price{
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
}

button{
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.order-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:white;
    color:black;
    font-size:18px;
    font-weight:bold;
}

.form-box{
    display:none;
    margin-top:20px;
    background:#1c1c1c;
    padding:20px;
    border-radius:20px;
}

.form-box h2{
    margin:0 0 15px;
}

.phone-box{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.phone-box input{
    flex:1;
    min-width:0;
}

.phone-submit-btn{
    width:90px;
    border:none;
    border-radius:10px;
    background:#00ff88;
    color:#000;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #444;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:white;
}

input::placeholder{
    color:#888;
}

.delivery-form{
    display:none;
    margin-top:15px;
}

.place-btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00ff88;
    color:#000;
    font-size:17px;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.my-orders-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:1px solid #555;
    border-radius:12px;
    background:#1c1c1c;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.orders-box{
    display:none;
    margin-top:20px;
}

.orders-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:15px;
}

.no-orders{
    background:#1c1c1c;
    border-radius:15px;
    padding:20px;
    text-align:center;
    color:#aaa;
}

.order-card{
    background:#1c1c1c;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

.order-id{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.order-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    color:#ccc;
}

.order-row strong{
    color:white;
    text-align:right;
}

.status{
    display:inline-block;
    margin-top:12px;
    padding:8px 12px;
    border-radius:20px;
    background:#333;
    color:#00ff88;
    font-size:14px;
    font-weight:bold;
}

.popup-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:999;
}

.popup{
    width:100%;
    max-width:350px;
    background:#1c1c1c;
    border-radius:20px;
    padding:25px 20px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
}

.popup h2{
    margin:5px 0 10px;
    font-size:24px;
}

.popup p{
    color:#bbb;
    line-height:1.5;
    font-size:14px;
}

.otp-input{
    text-align:center;
    letter-spacing:8px;
    font-size:22px;
    font-weight:bold;
}

.otp-submit-btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00ff88;
    color:#000;
    font-size:17px;
    font-weight:bold;
}

.success-icon{
    width:65px;
    height:65px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#00ff88;
    color:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    font-weight:bold;
}

.close-btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:white;
    color:black;
    font-size:16px;
    font-weight:bold;
}

.small-note{
    color:#888;
    font-size:12px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

    <div class="brand">
        ViveX
    </div>

    <div class="product">

        <img
            src="https://cdn.postimage.me/2026/09/04/368.png"
            alt="ViveX Product"
        >

        <h2>ViveX Product</h2>

        <div class="price">
            ₹499
        </div>

        <button
            class="order-btn"
            id="orderNowBtn"
        >
            ORDER NOW
        </button>

    </div>


    <!-- ORDER FORM -->

    <div
        class="form-box"
        id="orderForm"
    >

        <h2>Mobile Verification</h2>

        <div class="phone-box">

            <input
                type="tel"
                id="phone"
                placeholder="Mobile Number"
                inputmode="numeric"
                maxlength="10"
            >

            <button
                class="phone-submit-btn"
                id="phoneSubmitBtn"
            >
                SUBMIT
            </button>

        </div>


        <!-- TEST OTP -->

        <div
            class="delivery-form"
            id="deliveryForm"
        >

            <h2>Delivery Details</h2>

            <input
                type="text"
                id="name"
                placeholder="Full Name"
            >

            <input
                type="text"
                id="state"
                placeholder="State"
            >

            <input
                type="text"
                id="district"
                placeholder="District"
            >

            <input
                type="text"
                id="city"
                placeholder="City / Village"
            >

            <input
                type="text"
                id="pincode"
                placeholder="Pincode"
                inputmode="numeric"
                maxlength="6"
            >

            <input
                type="text"
                id="landmark"
                placeholder="Landmark (Optional)"
            >

            <button
                class="place-btn"
                id="placeBtn"
            >
                PLACE ORDER
            </button>

        </div>

    </div>


    <!-- MY ORDERS -->

    <button
        class="my-orders-btn"
        id="myOrdersBtn"
    >
        📦 MY ORDERS
    </button>

    <div
        class="orders-box"
        id="ordersBox"
    >

        <div class="orders-title">
            My Orders
        </div>

        <div id="ordersList"></div>

    </div>

</div>


<!-- OTP POPUP -->

<div
    class="popup-bg"
    id="otpPopup"
>

    <div class="popup">

        <h2>OTP Verification</h2>

        <p>
            This is currently a TEST MODE.
            Real OTP verification will be connected
            through a secure backend.
        </p>

        <input
            type="text"
            id="otp"
            class="otp-input"
            placeholder="OTP"
            inputmode="numeric"
            maxlength="6"
        >

        <button
            class="otp-submit-btn"
            id="otpSubmitBtn"
        >
            VERIFY
        </button>

        <div class="small-note">
            Demo OTP: 123456
        </div>

    </div>

</div>


<!-- SUCCESS POPUP -->

<div
    class="popup-bg"
    id="successPopup"
>

    <div class="popup">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Order Successful!
        </h2>

        <p id="successText"></p>

        <button
            class="close-btn"
            id="closeBtn"
        >
            OK
        </button>

    </div>

</div>


<script>

"use strict";


/* =========================
   VARIABLES
========================= */

let verifiedPhone = "";


/* =========================
   ELEMENTS
========================= */

const orderNowBtn =
    document.getElementById("orderNowBtn");

const orderForm =
    document.getElementById("orderForm");

const phone =
    document.getElementById("phone");

const phoneSubmitBtn =
    document.getElementById("phoneSubmitBtn");

const otpPopup =
    document.getElementById("otpPopup");

const otp =
    document.getElementById("otp");

const otpSubmitBtn =
    document.getElementById("otpSubmitBtn");

const deliveryForm =
    document.getElementById("deliveryForm");

const placeBtn =
    document.getElementById("placeBtn");

const myOrdersBtn =
    document.getElementById("myOrdersBtn");

const ordersBox =
    document.getElementById("ordersBox");

const ordersList =
    document.getElementById("ordersList");

const successPopup =
    document.getElementById("successPopup");

const successText =
    document.getElementById("successText");

const closeBtn =
    document.getElementById("closeBtn");


/* =========================
   ORDER NOW
========================= */

orderNowBtn.addEventListener(
    "click",
    function(){

        orderForm.style.display = "block";

        orderForm.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }
);


/* =========================
   PHONE SUBMIT
========================= */

phoneSubmitBtn.addEventListener(
    "click",
    function(){

        const number =
            phone.value.trim();


        if(!/^[6-9]\d{9}$/.test(number)){

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;
        }


        verifiedPhone = number;


        /*
         TEST MODE:
         Real OTP backend abhi connected nahi hai.
        */

        otp.value = "";

        otpPopup.style.display = "flex";

    }
);


/* =========================
   OTP VERIFY
========================= */

otpSubmitBtn.addEventListener(
    "click",
    function(){

        const value =
            otp.value.trim();


        if(value !== "123456"){

            alert(
                "Demo OTP galat hai.\n\nUse: 123456"
            );

            return;
        }


        otpPopup.style.display = "none";

        deliveryForm.style.display = "block";

        deliveryForm.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }
);


/* =========================
   GENERATE ORDER ID
========================= */

function generateOrderID(){

    const number =
        Math.floor(
            100000 +
            Math.random() * 900000
        );

    return "VX-" + number;
}


/* =========================
   PLACE ORDER
========================= */

placeBtn.addEventListener(
    "click",
    function(){

        const name =
            document.getElementById("name")
            .value.trim();

        const state =
            document.getElementById("state")
            .value.trim();

        const district =
            document.getElementById("district")
            .value.trim();

        const city =
            document.getElementById("city")
            .value.trim();

        const pincode =
            document.getElementById("pincode")
            .value.trim();

        const landmark =
            document.getElementById("landmark")
            .value.trim();


        if(
            !name ||
            !state ||
            !district ||
            !city ||
            !pincode
        ){

            alert(
                "Please fill all required details."
            );

            return;
        }


        if(!/^\d{6}$/.test(pincode)){

            alert(
                "Please enter a valid 6-digit pincode."
            );

            return;
        }


        const orderID =
            generateOrderID();

        const orderTime =
            new Date().toLocaleString("en-IN");


        const order = {

            id:orderID,

            product:"ViveX Product",

            price:"₹499",

            phone:verifiedPhone,

            name:name,

            state:state,

            district:district,

            city:city,

            pincode:pincode,

            landmark:
                landmark || "Not provided",

            time:orderTime,

            status:"Order Placed"

        };


        let orders = [];

        try{

            orders =
                JSON.parse(
                    localStorage.getItem(
                        "vivexOrders"
                    )
                ) || [];

        }
        catch(error){

            orders = [];

        }


        orders.unshift(order);


        localStorage.setItem(
            "vivexOrders",
            JSON.stringify(orders)
        );


        successText.innerText =
            "Your order ID is " + orderID;


        successPopup.style.display = "flex";


        clearForm();

        renderOrders();

    }
);


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    document.getElementById("name").value = "";
    document.getElementById("state").value = "";
    document.getElementById("district").value = "";
    document.getElementById("city").value = "";
    document.getElementById("pincode").value = "";
    document.getElementById("landmark").value = "";

}


/* =========================
   MY ORDERS
========================= */

myOrdersBtn.addEventListener(
    "click",
    function(){

        if(
            ordersBox.style.display === "block"
        ){

            ordersBox.style.display = "none";

            return;
        }


        ordersBox.style.display = "block";

        renderOrders();

        ordersBox.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }
);


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(){

    let orders = [];

    try{

        orders =
            JSON.parse(
                localStorage.getItem(
                    "vivexOrders"
                )
            ) || [];

    }
    catch(error){

        orders = [];

    }


    if(orders.length === 0){

        ordersList.innerHTML = `
            <div class="no-orders">
                No orders yet.
            </div>
        `;

        return;
    }


    ordersList.innerHTML =
        orders.map(function(order){

            return `
                <div class="order-card">

                    <div class="order-id">
                        ${order.id}
                    </div>

                    <div class="order-row">
                        <span>Product</span>
                        <strong>
                            ${order.product}
                        </strong>
                    </div>

                    <div class="order-row">
                        <span>Price</span>
                        <strong>
                            ${order.price}
                        </strong>
                    </div>

                    <div class="order-row">
                        <span>Name</span>
                        <strong>
                            ${order.name}
                        </strong>
                    </div>

                    <div class="order-row">
                        <span>Mobile</span>
                        <strong>
                            ${order.phone}
                        </strong>
                    </div>

                    <div class="order-row">
                        <span>City</span>
                        <strong>
                            ${order.city}
                        </strong>
                    </div>

                    <div class="order-row">
                        <span>Pincode</span>
                        <strong>
                            ${order.pincode}
                        </strong>
                    </div>

                    <div class="order-row">
                        <span>Time</span>
                        <strong>
                            ${order.time}
                        </strong>
                    </div>

                    <div class="status">
                        ${order.status}
                    </div>

                </div>
            `;

        }).join("");

}


/* =========================
   CLOSE POPUP
========================= */

closeBtn.addEventListener(
    "click",
    function(){

        successPopup.style.display = "none";

    }
);


/* =========================
   INITIAL LOAD
========================= */

renderOrders();

</script>

</body>
</html>
